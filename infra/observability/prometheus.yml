global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: volatility
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: telegram
    static_configs:
      - targets: ["host.docker.internal:9102"]

  - job_name: collector
    static_configs:
      - targets: ["host.docker.internal:9103"]
