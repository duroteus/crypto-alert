services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: crypto-alert-rabbit
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # UI web
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  postgres:
    image: postgres:17
    container_name: crypto-alert-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: crypto-alert-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
